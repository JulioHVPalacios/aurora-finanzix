<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Titanium Background -->
    <linearGradient id="bgObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Platinum Refraction Gradient -->
    <linearGradient id="platinumWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Emerald Apex Gradient -->
    <linearGradient id="emeraldWing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="60%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="valoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Chassis Surface -->
  <rect width="512" height="512" rx="124" fill="url(#bgObsidian)"/>
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2.5"/>

  <!-- Geometric "VALO" Monogram / Dynamic Delta Crest -->
  <g filter="url(#valoGlow)">
    <!-- Left Wing (Platinum Geometry) -->
    <path d="M128 140 L216 140 L256 290 L210 290 Z" fill="url(#platinumWing)"/>
    
    <!-- Right Wing (Emerald Surge) -->
    <path d="M384 140 L296 140 L256 290 L302 290 Z" fill="url(#emeraldWing)"/>

    <!-- Bottom Vertex Anchor -->
    <polygon points="210,290 302,290 256,380" fill="#10B981"/>

    <!-- Core Floating Prism Diamond -->
    <polygon points="256,180 290,240 256,270 222,240" fill="#FFFFFF" opacity="0.95"/>
  </g>
</svg>
